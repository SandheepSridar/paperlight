# Builds a signed APK whenever a version tag (v1.2.3) is pushed and publishes
# it as a GitHub Release. The app's self-updater looks at the latest release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match pubspec.yaml version $VER"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Signing secrets missing; see README 'One-time setup'"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/paperlight-release.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
